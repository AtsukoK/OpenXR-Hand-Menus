name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build layer DLL
        run: |
          cmake -S layer -B layer/build -A x64
          cmake --build layer/build --config Release --target VRRadialOverlay

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build editor (self-contained single file)
        run: >
          dotnet publish editor/VRRadialOverlayEditor.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o editor/bin/publish

      - name: Assemble release folder
        shell: pwsh
        run: |
          $out = "release/VRRadialOverlay"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item layer/build/Release/VRRadialOverlay.dll $out
          Copy-Item package/* $out
          Copy-Item editor/bin/publish/VRRadialOverlayEditor.exe $out
          Copy-Item docs/README.txt $out
          Copy-Item LICENSE $out/LICENSE.txt

      # The editor exe is signed here once the SignPath Foundation application is approved.

      - uses: actions/upload-artifact@v4
        with:
          name: VRRadialOverlay
          path: release/VRRadialOverlay
